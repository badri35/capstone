apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      smtp_smarthost: "${SMTP_HOST}:1025"
      smtp_from: "alertmanager@finsecure.local"
      smtp_require_tls: false
    route:
      receiver: devops-email
      group_by: [alertname]
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 30m
    receivers:
      - name: devops-email
        email_configs:
          - to: "devops@finsecure.local"
            send_resolved: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
          ports:
            - containerPort: 9093
          resources:
            requests: {cpu: 20m, memory: 40Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  selector:
    app: alertmanager
  ports:
    - port: 9093
      targetPort: 9093
