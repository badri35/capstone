apiVersion: apps/v1
kind: Deployment
metadata:
  name: finsecure-pay
  namespace: finsecure
  labels:
    app: finsecure-pay
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: finsecure-pay
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: finsecure-pay
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
      containers:
        - name: finsecure-pay
          image: docker.io/badri3590/finsecure-pay:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: finsecure-pay-config
          env:
            # Optional secret created out-of-band (never committed): see scripts/create-secrets.sh
            - name: PAYMENT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: finsecure-pay-secrets
                  key: payment-api-key
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
