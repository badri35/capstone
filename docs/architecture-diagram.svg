<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1010" viewBox="0 0 1500 1010" font-family="-apple-system,Helvetica,Arial,sans-serif"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#444"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="750.0" y="38" text-anchor="middle" font-size="26" font-weight="800" fill="#0b2545">FinSecure Pay - End-to-End Architecture</text><text x="750.0" y="62" text-anchor="middle" font-size="14" fill="#5b6b7b">Git -> Jenkins CI/CD with security gates -> Docker Hub -> Kubernetes (AWS EKS) with monitoring, logging and alerting</text><rect x="20" y="80" width="1460" height="330" rx="14" fill="#f4f7fb" stroke="#0b2545" stroke-width="2" stroke-dasharray="7 5"/><text x="36" y="104" font-size="16" font-weight="700" fill="#0b2545">CI/CD pipeline (Jenkins, pipeline-as-code: Jenkinsfile)</text><rect x="50" y="125" width="150" height="70" rx="10" fill="#0b2545" stroke="none" stroke-width="2"/><text x="125.0" y="157.0" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">Developer</text><text x="125.0" y="177.0" text-anchor="middle" font-size="12" fill="#fff" opacity=".9">git push</text><rect x="250" y="125" width="150" height="70" rx="10" fill="#0b2545" stroke="none" stroke-width="2"/><text x="325.0" y="157.0" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">GitHub</text><text x="325.0" y="177.0" text-anchor="middle" font-size="12" fill="#fff" opacity=".9">badri35/capstone</text><rect x="450" y="125" width="170" height="70" rx="10" fill="#138d90" stroke="none" stroke-width="2"/><text x="535.0" y="157.0" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">Jenkins</text><text x="535.0" y="177.0" text-anchor="middle" font-size="12" fill="#fff" opacity=".9">polls Git every minute</text><rect x="670" y="125" width="190" height="70" rx="10" fill="#138d90" stroke="none" stroke-width="2"/><text x="765.0" 