ction ratio &gt; 50%</text><rect x="1090" y="745" width="170" height="70" rx="10" fill="#0b2545" stroke="none" stroke-width="2"/><text x="1175.0" y="777.0" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">SMTP inbox</text><text x="1175.0" y="797.0" text-anchor="middle" font-size="12" fill="#fff" opacity=".9">alert + build emails</text><line x1="1000" y1="795" x2="1090" y2="780" stroke="#d9822b" stroke-width="2.2" marker-end="url(#a)"/><rect x="1090" y="870" width="170" height="70" rx="10" fill="#7a4fb5" stroke="none" stroke-width="2"/><text x="1175.0" y="902.0" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">AI triage (proposed)</text><text x="1175.0" y="922.0" text-anchor="middle" font-size="12" fill="#fff" opacity=".9">LLM + anomaly detection</text><line x1="930" y1="825" x2="1090" y2="895" stroke="#7a4fb5" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#a)"/><text x="1035" y="880" font-size="12" fill="#7a4fb5">webhook</text><text x="1175" y="960" text-anchor="middle" font-size="12" fill="#7a4fb5">suggests cause + action, human approves rollback</text><rect x="460" y="925" width="170" height="50" rx="10" fill="#0b2545" stroke="none" stroke-width="2"/><text x="545.0" y="955.0" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">Engineer</text><line x1="545" y1="925" x2="545" y2="905" stroke="#0b2545" stroke-width="2.2" marker-end="url(#a)"/><text x="640" y="955" font-size="12" fill="#5b6b7b">dashboards, kubectl logs</text></svg>