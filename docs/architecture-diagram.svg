" fill="#fff" opacity=".9">Trivy image: HIGH/CRITICAL blocks</text><rect x="670" y="255" width="190" height="70" rx="10" fill="#0b2545" stroke="none" stroke-width="2"/><text x="765.0" y="287.0" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">Docker Hub</text><text x="765.0" y="307.0" text-anchor="middle" font-size="12" fill="#fff" opacity=".9">badri3590/finsecure-pay</text><rect x="450" y="255" width="170" height="70" rx="10" fill="#138d90" stroke="none" stroke-width="2"/><text x="535.0" y="287.0" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">Deploy</text><text x="535.0" y="307.0" text-anchor="middle" font-size="12" fill="#fff" opacity=".9">kubectl set image</text><rect x="250" y="255" width="150" height="70" rx="10" fill="#138d90" stroke="none" stroke-width="2"/><text x="325.0" y="287.0" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">Verify</text><text x="325.0" y="307.0" text-anchor="middle" font-size="12" fill="#fff" opacity=".9">rollout status</text><rect x="50" y="255" width="150" height="70" rx="10" fill="#d9822b" stroke="none" stroke-width="2"/><text x="125.0" y="287.0" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">Rollback</text><text x="125.0" y="307.0" text-anchor="middle" font-size="12" fill="#fff" opacity=".9">rollout undo</text><line x1="1320" y1="195" x2="1320" y2="255" stroke="#444" stroke-width="2.2" marker-end="url(#a)"/><line x1="1190" y1="290" x2="1140" y2="290" stroke="#444" stroke-width="2.2" marker-end="url(#a)"/><line x1="910" y1="290" x2="860" y2="290" stroke="#444" stroke-width="2.2" marker-end="url(#a)"/><line x1="670" y1="290" x2="620" y2="290" stroke="#444" stroke-width="2.2" marker-end="url(#a)"/><line x1="450" y1="290" x2="400" y2="290" stroke="#444" stroke-width="2.2" marker-end="url(#a)"/><line x1="250" y1="290" x2="200" y2="290" stroke="#444" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#a)"/><text x="225" y="345" text-anchor="middle" font-size="12" fill="#d9822b">if rollout fails</text><text x="1000" y="385" text-anchor="middle" font-size="13" fill="#5b6b7b">Secrets: Jenkins credential store (masked) - none in git  |  Email on every build via SMTP</text><line x1="535" y1="325" x2="535" y2="470" stroke="#1e8e3e" stroke-width="2.2" marker-end="url(#a)"/><text x="548" y="425" font-size="13" fill="#1e8e3e">deploy new version</text><rect x="20" y="430" width="1020" height="560" rx="14" fill="#eef6f6" stroke="#0b2545" stroke-width="2" stroke-dasharray="7 5"/><text x="36" y="454" font-size="16" font-weight="700" fill="#0b2545">AWS EKS (us-east-1, managed Kubernetes, 2 x t3.small)  -  same manifests also run on minikube</text><rect x="40" y="470" width="980" height="230" rx="14" fill="#ffffff" stroke="#138d90" stroke-width="2" stroke-dasharray="7 5"/><text x="56" y="494" font-size="16" font-weight="700" fill="#138d90">namespace: finsecure  (Deployment: 2 replicas, probes, rolling update)</text><rect x="60" y="535" width="130" height="60" rx="10" fill="#0b2545" stroke="none" stroke-width="2"/><text x="125.0" y="562.0" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">API clients</text><text x="125.0" y="582.0" text-anchor="middle" font-size="12" fill="#fff" opacity=".9">/health, /validate</text><rect x="230" y="535" width="150" height="60" rx="10" fill="#1e8e3e" stroke="none" stroke-width="2"/><text x="305.0" y="562.0" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">Service</text><text x="305.0" y="582.0" text-anchor="middle" font-size="12" fill="#fff" opacity=".9">LoadBalancer (ELB)</text><rect x="430" y="505" width="170" height="60" rx="10" fill="#138d90" stroke="none" stroke-width="2"/><text x="515.0" y="532.0" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">Pod 1 (Ready)</text><text x="515.0" y="552.0" text-anchor="middle" font-size="12" fill="#fff" opacity=".9">Spring Boot app</text><rect x="430" y="590" width="170" height="60" rx="10" fill="#138d90" stroke=